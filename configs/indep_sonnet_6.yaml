# sonnet x 6 agent(s), OPEN protocol (Park et al. 2609.21032): no rounds, shared directory,
# sonnet x 6 INDEPENDENT agents: open protocol with the shared log switched off. Each agent
# sees only its own entries; this is Park et al.'s best@k control at matched compute.
cell_id: indep_sonnet_6
protocol: open
open_share_log: false
harness: claude_code
agents:
  - {id: a0, model: claude-sonnet-5, effort: medium}
  - {id: a1, model: claude-sonnet-5, effort: medium}
  - {id: a2, model: claude-sonnet-5, effort: medium}
  - {id: a3, model: claude-sonnet-5, effort: medium}
  - {id: a4, model: claude-sonnet-5, effort: medium}
  - {id: a5, model: claude-sonnet-5, effort: medium}
bon: 1

train_run_budget: 36
train_timeout_s: 900   # a real run is ~330 s; margin for compile under load
max_train_attempts: 3

autoresearch_repo: ~/autoresearch
autoresearch_commit: ""   # pin this before the real runs (setup_gpu_box.sh prints it)

# one long session per agent, resumed while its share lasts; a solo agent does all 36 runs in one session
max_budget_usd_per_session: 1000.0   # no ceiling: spend is notional on the plan
cell_budget_usd: 100000.0
open_session_timeout_s: 21600
open_max_resumes: 40
seed: 0
