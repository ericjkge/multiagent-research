      # haiku x 3 agent(s), OPEN protocol (Park et al. 2609.21032): no rounds, shared directory,
      # each agent works asynchronously against a 12-run share of the same 36-run budget.
      cell_id: open_haiku_3
      protocol: open
      harness: claude_code
      agents:
        - {id: a0, model: claude-haiku-4-5-20251001, effort: medium}
- {id: a1, model: claude-haiku-4-5-20251001, effort: medium}
- {id: a2, model: claude-haiku-4-5-20251001, effort: medium}
      bon: 1

      train_run_budget: 36
      train_timeout_s: 600
      max_train_attempts: 3

      autoresearch_repo: ~/autoresearch
      autoresearch_commit: ""   # pin this before the real runs (setup_gpu_box.sh prints it)

      # one long session per agent; segments are resumed while the share lasts
      max_budget_usd_per_session: 8.0
      cell_budget_usd: 60.0
      open_session_timeout_s: 5400
      open_max_resumes: 8
      seed: 0
