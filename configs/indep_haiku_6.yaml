# haiku x 6 agent(s), OPEN protocol (Park et al. 2609.21032): no rounds, shared directory,
# haiku x 6 INDEPENDENT agents: open protocol with the shared log switched off. Each agent
# sees only its own entries; this is Park et al.'s best@k control at matched compute.
cell_id: indep_haiku_6
protocol: open
open_share_log: false
harness: claude_code
agents:
  - {id: a0, model: claude-haiku-4-5-20251001, effort: medium}
  - {id: a1, model: claude-haiku-4-5-20251001, effort: medium}
  - {id: a2, model: claude-haiku-4-5-20251001, effort: medium}
  - {id: a3, model: claude-haiku-4-5-20251001, effort: medium}
  - {id: a4, model: claude-haiku-4-5-20251001, effort: medium}
  - {id: a5, model: claude-haiku-4-5-20251001, effort: medium}
bon: 1

train_run_budget: 36
train_timeout_s: 900   # a real run is ~330 s; margin for compile under load
max_train_attempts: 3

autoresearch_repo: ~/autoresearch
autoresearch_commit: ""   # pin this before the real runs (setup_gpu_box.sh prints it)

# one long session per agent, resumed while its share lasts; a solo agent does all 36 runs in one session
max_budget_usd_per_session: 15.0
cell_budget_usd: 80.0
open_session_timeout_s: 21600
open_max_resumes: 12
seed: 0
