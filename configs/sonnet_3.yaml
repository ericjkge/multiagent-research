# sonnet x 3 agent(s).  Compute-matched: 3 agents x BoN=2 candidates per round.
cell_id: sonnet_3
harness: claude_code
agents:
  - {id: a0, model: claude-sonnet-5, effort: medium}
  - {id: a1, model: claude-sonnet-5, effort: medium}
  - {id: a2, model: claude-sonnet-5, effort: medium}
bon: 2

# 36 five-minute runs ~ 3.3 GPU-hours, identical across every cell in the grid.
train_run_budget: 36
train_timeout_s: 900   # a real run is ~330 s; margin for compile under load
max_train_attempts: 3

autoresearch_repo: ~/autoresearch
autoresearch_commit: "228791fb499afffb54b46200aca536f79142f117"   # pin this before the real runs (setup_gpu_box.sh prints it)

max_budget_usd_per_session: 1000.0   # no ceiling: spend is notional on the plan
cell_budget_usd: 100000.0
seed: 0
phase_timeout_s: {propose: 900, select: 7200, respond: 1200}   # 6 agents queue on one GPU
