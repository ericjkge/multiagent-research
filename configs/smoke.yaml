# Laptop smoke test: two Haiku agents, simulated GPU, a handful of runs.
# Exercises the whole loop -- parallelism, the GPU mutex, worktrees, BoN,
# selection, archiving -- for a few cents and a few minutes.
cell_id: smoke
harness: claude_code
agents:
  - {id: a0, model: claude-haiku-4-5-20251001, effort: low}
  - {id: a1, model: claude-haiku-4-5-20251001, effort: low}
bon: 1
train_run_budget: 4
train_timeout_s: 120
max_train_attempts: 2
autoresearch_repo: ~/.cache/arena-fake-autoresearch
autoresearch_commit: ""
max_budget_usd_per_session: 1000.0   # no ceiling: spend is notional on the plan
cell_budget_usd: 100000.0
fake_gpu: true
phase_timeout_s: {propose: 300, select: 900, respond: 400}
seed: 7
